name: Funky CI

# Builds the unit-test preset on Linux, runs the tests and publishes the build
# log tail and the workshop screenshots to the `ci-results` branch, so they can
# be read with plain git (no artifact download needed).

on:
  push:
    branches-ignore: [ci-results, upstream-sync]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: ./scripts/install_prerequisites.sh

      - name: Configure
        run: cmake --preset Test -D ENABLE_COVERAGE=OFF

      - name: Build
        id: build
        run: |
          set -o pipefail
          cmake --build --preset Test -- -k 0 2>&1 | tee build.log

      - name: Run tests
        id: tests
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          ctest --test-dir out/build/Test --output-on-failure 2>&1 | tee ctest.log

      - name: Publish results to ci-results branch
        if: always()
        run: |
          set +e
          mkdir -p /tmp/res
          echo "commit ${GITHUB_SHA}  build=${{ steps.build.outcome }}  tests=${{ steps.tests.outcome }}" > /tmp/res/SUMMARY.txt
          [ -f build.log ] && grep -nE "error|Error|undefined reference" build.log | head -300 > /tmp/res/build_errors.txt
          [ -f build.log ] && tail -400 build.log > /tmp/res/build_tail.log
          [ -f ctest.log ] && tail -600 ctest.log > /tmp/res/ctest_tail.log
          mkdir -p /tmp/res/workshop /tmp/res/errors
          cp tests/ref_imgs/workshop/*.png /tmp/res/workshop/ 2>/dev/null
          find tests/ref_imgs -name "*_err.png" -exec cp {} /tmp/res/errors/ \; 2>/dev/null
          cd /tmp/res
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
